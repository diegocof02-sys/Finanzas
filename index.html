<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a" id="theme-color-meta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/Finanzas/icon-192.png">
<title>Panel Financiero</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#273549;--border:#334155;
  --primary:#6366f1;--primary-d:#4f46e5;--success:#10b981;--warning:#f59e0b;
  --danger:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--dim:#64748b;
  --r:12px;--rs:8px;--nav:60px;--side:220px;--top:54px;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
html[data-theme="light"]{
  --bg:#f1f5f9;--surface:#ffffff;--surface2:#f8fafc;--border:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--dim:#94a3b8;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
html[data-theme="light"] .prog-wrap{background:#e2e8f0}
html[data-theme="light"] .institution-header{background:#f8fafc}
html[data-theme="light"] .seg{background:#f1f5f9}
html[data-theme="light"] .seg-btn.active{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
html[data-theme="light"] .cat-opt{background:#f8fafc}
html[data-theme="light"] .cat-opt:hover{background:#e2e8f0}
html[data-theme="light"] .cat-opt.selected{background:rgba(99,102,241,.08)}
html[data-theme="light"] .tx-item{background:#fff}
html[data-theme="light"] .modal{background:#fff}
html[data-theme="light"] .form-control{background:#f8fafc;color:#0f172a}
html[data-theme="light"] .bottom-nav{background:#fff}
html[data-theme="light"] .topbar{background:#fff}
html[data-theme="light"] .sidebar{background:#fff}
html[data-theme="light"] .sidebar-logo{border-bottom-color:#e2e8f0}
html[data-theme="light"] .cur-card{background:#fff}
html[data-theme="light"] .stat-card{background:#fff}
html[data-theme="light"] .card{background:#fff}
html[data-theme="light"] .chart-box{background:#fff}
html[data-theme="light"] .institution{background:#fff}
html[data-theme="light"] .month-nav{background:#f1f5f9}
html[data-theme="light"] .icon-btn{background:#f1f5f9}
html[data-theme="light"] .icon-btn:hover{background:#e2e8f0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px}
#app{display:flex;height:100%;overflow:hidden;width:100%}

/* Sidebar */
.sidebar{width:var(--side);min-width:var(--side);background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10}
.sidebar-logo{padding:16px 20px;font-size:1rem;font-weight:800;color:var(--text);
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);letter-spacing:.02em}
.sidebar-logo svg{flex-shrink:0}
.nav-section{padding:8px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 20px;cursor:pointer;
  border-radius:0 var(--r) var(--r) 0;margin:1px 10px 1px 0;color:var(--muted);
  font-size:.85rem;font-weight:500;letter-spacing:.01em;
  transition:all .15s;border:none;background:none;text-align:left;width:calc(100% - 10px)}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.sidebar-footer{padding:8px 0 16px}

/* Main */
.main-content{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:var(--top);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex-shrink:0}
.topbar-title{font-size:.95rem;font-weight:700;letter-spacing:.02em;color:var(--text)}
.topbar-actions{display:flex;gap:8px}
.icon-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  height:32px;padding:0 12px;border-radius:var(--rs);cursor:pointer;font-size:.75rem;
  font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:6px;transition:all .15s}
.icon-btn:hover{background:var(--border);color:var(--text)}

/* Pages */
#pages{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page{display:none;padding:20px;min-height:100%}
.page.active{display:block}

/* Bottom nav — hidden, replaced by drawer on mobile */
.bottom-nav{display:none}
.bn-icon{width:18px;height:18px}

/* Mobile drawer */
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:150;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;left:0;bottom:0;width:240px;background:var(--surface);
  z-index:151;transform:translateX(-100%);transition:transform .25s ease;
  display:flex;flex-direction:column;padding:0;
  box-shadow:4px 0 24px rgba(0,0,0,.3)}
.drawer.open{transform:translateX(0)}
.drawer-overlay.open{display:block}
.drawer-header{padding:20px 20px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between}
.drawer-title{font-size:1rem;font-weight:800;letter-spacing:.02em}
.drawer-close{background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:1.3rem;line-height:1;padding:4px}
.drawer-nav{padding:8px 0;flex:1}
.drawer-item{display:flex;align-items:center;gap:12px;padding:12px 20px;
  cursor:pointer;color:var(--muted);font-size:.9rem;font-weight:500;
  border:none;background:none;text-align:left;width:100%;transition:all .15s}
.drawer-item:hover{background:var(--surface2);color:var(--text)}
.drawer-item.active{color:var(--primary);font-weight:700}
.drawer-item svg{flex-shrink:0;opacity:.7}
.drawer-item.active svg{opacity:1}
.drawer-footer{padding:12px 0 20px;border-top:1px solid var(--border)}
.hamburger{display:none;background:none;border:none;color:var(--text);
  cursor:pointer;padding:4px;margin-right:4px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* Stat cards */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;font-weight:600}
.stat-value{font-size:1.35rem;font-weight:800;color:var(--text);line-height:1.1}
.stat-sub{font-size:.68rem;color:var(--dim);margin-top:3px}

/* Section label */
.sec{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.09em;margin:20px 0 10px}
.sec:first-child{margin-top:0}

/* Progress */
.prog-wrap{background:var(--surface2);border-radius:100px;overflow:hidden;height:8px}
.prog-bar{height:100%;border-radius:100px;
  background:linear-gradient(90deg,var(--primary),var(--success));transition:width .7s ease}

/* Currency total cards */
.cur-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;position:relative;overflow:hidden}
.cur-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.cur-card.mxn::before{background:var(--success)}
.cur-card.usd::before{background:var(--warning)}
.cur-card.eur::before{background:var(--primary)}
.cur-card-label{font-size:.68rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.cur-card-total{font-size:1.5rem;font-weight:800;line-height:1}
.cur-card.mxn .cur-card-total{color:var(--success)}
.cur-card.usd .cur-card-total{color:var(--warning)}
.cur-card.eur .cur-card-total{color:var(--primary-d);color:#818cf8}
.cur-card-mxn{font-size:.72rem;color:var(--dim);margin-top:5px}

/* Institution group */
.institution{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.institution-header{padding:12px 16px;background:var(--surface2);
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border)}
.institution-name{font-size:.85rem;font-weight:700;color:var(--text)}
.institution-mxn{font-size:.72rem;color:var(--muted)}
.acc-row{display:flex;align-items:center;padding:10px 16px;gap:12px;
  border-bottom:1px solid var(--border)}
.acc-row:last-child{border-bottom:none}
.acc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.acc-row-info{flex:1;font-size:.82rem;color:var(--muted)}
.acc-row-bal{font-size:.9rem;font-weight:700;color:var(--text)}
.acc-row-mxn{font-size:.65rem;color:var(--dim);text-align:right}

/* Transaction list */
.tx-list{display:flex;flex-direction:column;gap:1px;background:var(--border);
  border-radius:var(--r);overflow:hidden}
.tx-item{background:var(--surface);display:flex;align-items:center;gap:11px;padding:11px 14px}
.tx-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-title{font-size:.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:.67rem;color:var(--muted);margin-top:1px}
.tx-right{text-align:right;flex-shrink:0}
.tx-amt{font-size:.85rem;font-weight:700}
.tx-amt.exp{color:var(--danger)}
.tx-amt.inc{color:var(--success)}
.tx-amt.trf{color:var(--primary)}
.tx-mxn{font-size:.63rem;color:var(--dim)}

/* Chart */
.chart-box{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:14px}
.chart-box canvas{max-height:210px}
.chart-title{font-size:.72rem;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}

/* Forms */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.73rem;font-weight:600;color:var(--muted);
  margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.form-control{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);padding:9px 12px;font-size:.875rem;
  transition:border-color .15s;outline:none;-webkit-appearance:none;appearance:none}
.form-control:focus{border-color:var(--primary)}
.form-control option{background:var(--surface)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Buttons */
.btn{padding:9px 16px;border-radius:var(--rs);border:none;cursor:pointer;
  font-size:.8rem;font-weight:700;letter-spacing:.03em;transition:all .15s;
  display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface2)}
.btn-block{width:100%}

/* FAB */
.fab{position:fixed;bottom:calc(var(--nav) + 14px);right:18px;
  background:var(--primary);color:#fff;border:none;
  padding:0 20px;height:44px;border-radius:22px;
  font-size:.8rem;font-weight:700;letter-spacing:.04em;
  cursor:pointer;box-shadow:0 4px 18px rgba(99,102,241,.4);z-index:90;
  display:flex;align-items:center;gap:8px;transition:all .2s}
.fab:hover{background:var(--primary-d);transform:translateY(-1px)}
.fab-plus{font-size:1.2rem;font-weight:300}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;
  backdrop-filter:blur(3px);display:none}
.modal{position:fixed;bottom:0;left:0;right:0;background:var(--surface);
  border-radius:var(--r) var(--r) 0 0;padding:16px 18px 28px;z-index:201;
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:slideUp .22s ease;display:none;
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0))}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:3px;background:var(--border);
  border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:1rem;font-weight:800;margin-bottom:18px;
  letter-spacing:.01em;text-align:center}

/* Month nav */
.month-nav{display:flex;align-items:center;background:var(--surface2);
  border:1px solid var(--border);border-radius:var(--rs);
  overflow:hidden;width:fit-content;margin-bottom:14px}
.month-nav button{background:none;border:none;color:var(--text);
  width:32px;height:30px;cursor:pointer;font-size:.95rem;
  display:flex;align-items:center;justify-content:center;transition:background .15s}
.month-nav button:hover{background:var(--border)}
.month-nav span{font-size:.78rem;font-weight:600;padding:0 10px;
  white-space:nowrap;min-width:76px;text-align:center;color:var(--text)}

/* Pill tabs */
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:5px 12px;border-radius:100px;border:1px solid var(--border);
  background:none;color:var(--muted);cursor:pointer;font-size:.73rem;
  font-weight:600;letter-spacing:.03em;transition:all .15s;white-space:nowrap}
.pill.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* Segment tabs */
.seg{display:flex;background:var(--surface2);border-radius:var(--rs);
  padding:3px;margin-bottom:18px;border:1px solid var(--border)}
.seg-btn{flex:1;padding:7px;border:none;background:none;color:var(--muted);
  cursor:pointer;border-radius:calc(var(--rs) - 2px);font-size:.75rem;
  font-weight:700;letter-spacing:.03em;transition:all .15s}
.seg-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* Category selector */
.cat-list{display:flex;flex-direction:column;gap:2px;margin-bottom:4px;
  border:1px solid var(--border);border-radius:var(--rs);overflow:hidden}
.cat-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;
  cursor:pointer;background:var(--surface2);border:none;text-align:left;
  width:100%;color:var(--text);font-size:.82rem;font-weight:500;transition:background .12s;
  border-bottom:1px solid var(--border)}
.cat-opt:last-child{border-bottom:none}
.cat-opt:hover{background:var(--border)}
.cat-opt.selected{background:rgba(99,102,241,.15)}
.cat-opt .cd{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-opt.selected .cd{box-shadow:0 0 0 3px rgba(99,102,241,.3)}

/* Rate rows */
.rate-row{display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--border)}
.rate-row:last-child{border-bottom:none}
.rate-row-label{font-size:.82rem;color:var(--text)}
.rate-in{width:120px;text-align:right}

/* Delete btn */
.del-btn{background:none;border:none;color:var(--dim);cursor:pointer;
  padding:4px 6px;font-size:.75rem;border-radius:4px;transition:color .15s;
  font-weight:700;letter-spacing:.02em}
.del-btn:hover{color:var(--danger)}

/* Toast */
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-60px);
  background:var(--success);color:#fff;padding:8px 18px;border-radius:var(--r);
  font-size:.78rem;font-weight:700;letter-spacing:.03em;z-index:400;
  transition:transform .28s ease;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}

/* Empty */
.empty{text-align:center;padding:36px 20px;color:var(--dim);font-size:.85rem}

/* Divider */
.divider{height:1px;background:var(--border);margin:16px 0}

/* Info badge */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;
  font-size:.67rem;font-weight:700;letter-spacing:.04em}
.tag-mxn{background:rgba(16,185,129,.12);color:#10b981}
.tag-usd{background:rgba(245,158,11,.12);color:#f59e0b}
.tag-eur{background:rgba(129,140,248,.12);color:#818cf8}

/* Scrollbar */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Responsive */
@media(max-width:768px){
  .sidebar{display:none !important}
  .bottom-nav{display:none !important}
  .hamburger{display:flex !important}
  .main-content{width:100%}
  .fab{display:none !important}
  .page{padding:14px}
  .grid3{grid-template-columns:1fr 1fr 1fr}
  .topbar-actions .icon-btn[onclick="openRatesModal()"]{display:none}
}
@media(min-width:769px){
  .fab{bottom:24px;right:32px}
  .drawer,.drawer-overlay{display:none !important}
}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar desktop -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect width="24" height="24" rx="6" fill="#6366f1"/>
        <rect x="4" y="15" width="3" height="6" rx="1" fill="white" opacity=".6"/>
        <rect x="10" y="10" width="3" height="11" rx="1" fill="white" opacity=".8"/>
        <rect x="16" y="5" width="3" height="16" rx="1" fill="white"/>
      </svg>
      Panel Financiero
    </div>
    <div class="nav-section">
      <button class="nav-item active" data-page="resumen">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1" y="8" width="3" height="7" rx=".5"/><rect x="6.5" y="5" width="3" height="10" rx=".5"/>
          <rect x="12" y="2" width="3" height="13" rx=".5"/>
        </svg>
        Resumen
      </button>
      <button class="nav-item" data-page="cuentas">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1" y="4" width="14" height="10" rx="1.5"/>
          <path d="M1 7h14"/><circle cx="4.5" cy="10" r="1" fill="currentColor" stroke="none"/>
        </svg>
        Cuentas
      </button>
      <button class="nav-item" data-page="gastos">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 2v12M4 6l4-4 4 4"/><path d="M4 13h8"/>
        </svg>
        Gastos
      </button>
      <button class="nav-item" data-page="mover">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2 5h12M10 2l4 3-4 3"/><path d="M14 11H2M6 8l-4 3 4 3"/>
        </svg>
        Movimientos
      </button>
    </div>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="openRatesModal()">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="2.5"/>
          <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41"/>
        </svg>
        Configurar
      </button>
    </div>
  </nav>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title" style="display:flex;align-items:center;gap:8px">
        <button class="hamburger" onclick="openDrawer()">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="19" y2="6"/><line x1="3" y1="11" x2="19" y2="11"/><line x1="3" y1="16" x2="19" y2="16"/>
          </svg>
        </button>
        Panel Financiero
        <span id="sync-status" title="Sincronizando..."
          style="width:7px;height:7px;border-radius:50%;background:var(--dim);
          flex-shrink:0;transition:background .3s"></span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="openExpenseModal()">+ Gasto</button>
        <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Cambiar tema"></button>
        <button class="icon-btn" onclick="openRatesModal()">Configurar</button>
      </div>
    </header>
    <div id="pages">
      <section id="page-resumen" class="page active"></section>
      <section id="page-cuentas" class="page"></section>
      <section id="page-gastos" class="page"></section>
      <section id="page-mover" class="page"></section>
    </div>
  </div>

  <!-- Bottom nav mobile -->
  <nav class="bottom-nav">
    <ul>

<script>
// ═══════════════════════════════════════════════
// SUPABASE
// ═══════════════════════════════════════════════
const SB_URL = 'https://evxelsyjgmmenxzmxyfa.supabase.co';
const SB_KEY = 'sb_publishable_cwsr4N0O244TZXhBRd9Ojw_eLWtx3T3';
const sb = supabase.createClient(SB_URL, SB_KEY);

function setSyncStatus(status) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  const colors = { syncing:'var(--warning)', synced:'var(--success)', error:'var(--danger)', offline:'var(--dim)' };
  const labels = { syncing:'Sincronizando...', synced:'Sincronizado', error:'Error de sincronizacion', offline:'Sin conexion' };
  el.style.background = colors[status] || colors.offline;
  el.title = labels[status] || '';
}

async function initFromSupabase() {
  setSyncStatus('syncing');
  try {
    const { data, error } = await sb.from('fp_state').select('data').eq('id','main').single();
    if (data && data.data) {
      S = data.data;
      migrateState(S);
      localStorage.setItem('fp3', JSON.stringify(S));
    } else {
      // Primera vez: subir el estado local a Supabase
      await sb.from('fp_state').upsert({ id:'main', data: S, updated_at: new Date().toISOString() });
    }
    setSyncStatus('synced');
  } catch(e) {
    setSyncStatus('offline');
  }
  render(page);
  subscribeRealtime();
}

function subscribeRealtime() {
  sb.channel('fp_sync')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'fp_state' }, payload => {
      const incoming = payload.new.data;
      if (!incoming || JSON.stringify(incoming) === JSON.stringify(S)) return;
      S = incoming;
      migrateState(S);
      localStorage.setItem('fp3', JSON.stringify(S));
      render(page);
      setSyncStatus('synced');
      toast('Datos actualizados desde otro dispositivo');
    })
    .subscribe();
}

function migrateState(s) {
  s.accounts.forEach(a => {
    if (!a.group) a.group = a.name.replace(/ (MXN|USD|EUR)$/,'').trim();
  });
}

function pushToSupabase() {
  setSyncStatus('syncing');
  sb.from('fp_state')
    .upsert({ id:'main', data: S, updated_at: new Date().toISOString() })
    .then(({ error }) => setSyncStatus(error ? 'error' : 'synced'))
    .catch(() => setSyncStatus('error'));
}

// ═══════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════
const CATS = [
  {id:'restaurantes', name:'Restaurantes',    color:'#ef4444'},
  {id:'vuelos',       name:'Vuelos / Viajes', color:'#6366f1'},
  {id:'salidas',      name:'Salidas',         color:'#f97316'},
  {id:'cafe',         name:'Cafe y Snacks',   color:'#d97706'},
  {id:'shopping',     name:'Shopping',        color:'#ec4899'},
  {id:'entrete',      name:'Entretenimiento', color:'#8b5cf6'},
  {id:'otros',        name:'Otros',           color:'#64748b'},
];

const CURRENCIES = ['MXN','USD','EUR'];
const SYM = {MXN:'$',USD:'$',EUR:'€'};

function defaultState(){
  return {
    accounts:[
      {id:'revolut-eur', name:'Revolut',       group:'Revolut',       currency:'EUR', balance:254,    color:'#6366f1'},
      {id:'revolut-mxn', name:'Revolut MXN',   group:'Revolut',       currency:'MXN', balance:23892,  color:'#8b5cf6'},
      {id:'bbva-eur',    name:'BBVA',           group:'BBVA',          currency:'EUR', balance:19.17,  color:'#3b82f6'},
      {id:'finsus-mxn',  name:'Finsus',         group:'Finsus',        currency:'MXN', balance:194000, color:'#10b981'},
      {id:'efectivo-usd',name:'Efectivo',        group:'Efectivo',      currency:'USD', balance:2000,   color:'#f59e0b'},
      {id:'bitso-mxn',   name:'Bitcoin Bitso',  group:'Bitcoin Bitso', currency:'MXN', balance:7380,   color:'#f97316'},
    ],
    transactions:[],
    rates:{USD:17.50, EUR:19.50},
    goal:750000,
  };
}

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let S = (()=>{
  try{
    const r = localStorage.getItem('fp3');
    if(!r) return defaultState();
    const parsed = JSON.parse(r);
    // migrate: add group field if missing
    parsed.accounts.forEach(a => {
      if(!a.group) a.group = a.name.replace(/ (MXN|USD|EUR)$/,'').trim();
    });
    return parsed;
  } catch{ return defaultState(); }
})();

function save(){
  localStorage.setItem('fp3', JSON.stringify(S));
  pushToSupabase();
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
const toMXN = (n,cur) => cur==='MXN'?n : cur==='USD'?n*S.rates.USD : n*S.rates.EUR;
const getAcc  = id => S.accounts.find(a=>a.id===id);
const getCat  = id => CATS.find(c=>c.id===id) || CATS[CATS.length-1];
const uid     = () => Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today   = () => new Date().toISOString().slice(0,10);
const curMK   = () => new Date().toISOString().slice(0,7);

function mName(mk){
  const[y,m]=mk.split('-');
  return new Date(+y,+m-1,1).toLocaleString('es-MX',{month:'short',year:'2-digit'});
}
function fmt(n, cur){
  const s = Math.abs(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?'-':'') + (SYM[cur]||'') + s + ' ' + cur;
}
function fmtShort(n, cur){
  const abs = Math.abs(n);
  let s;
  if(abs>=1000000) s = (abs/1000000).toFixed(2)+'M';
  else if(abs>=1000) s = (abs/1000).toFixed(1)+'k';
  else s = abs.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?'-':'') + (SYM[cur]||'') + s;
}
function fmtMXN(n){
  return '$' + Math.abs(n).toLocaleString('es-MX',{maximumFractionDigits:0}) + ' MXN';
}
function totalMXN(){
  return S.accounts.reduce((s,a)=>s+toMXN(a.balance,a.currency),0);
}
function monthExpenses(mk){
  return S.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(mk));
}
function buildCatTotals(mk){
  const r={};
  CATS.forEach(c=>r[c.id]=0);
  monthExpenses(mk).forEach(t=>{ r[t.cat||'otros']=(r[t.cat||'otros']||0)+toMXN(t.amount,t.currency); });
  return r;
}

}

}

  document.getElementById('drawer').classList.remove('open');

}

  document.querySelectorAll('.drawer-item[data-page]').forEach(b=>

  else if(p==='cuentas') renderCuentas();
  else if(p==='gastos') renderGastos();

// ═══════════════════════════════════════════════
// PAGE: RESUMEN

let rMonth   = curMK();
let rPeriod  = 'mes'; // 'mes' | 'ano'

function renderResumen(){
  const total = totalMXN();
  const goal  = S.goal;
  const pct   = Math.min(100,(total/goal)*100);
  const rPrefix = rPeriod==='ano' ? curYear() : rMonth;
  const mTxs  = S.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(rPrefix));
  const mTotal= mTxs.reduce((s,t)=>s+toMXN(t.amount,t.currency),0);
  const ct    = {};
  CATS.forEach(c=>ct[c.id]=0);
  mTxs.forEach(t=>{ ct[t.cat||'otros']=(ct[t.cat||'otros']||0)+toMXN(t.amount,t.currency); });

  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(); d.setMonth(d.getMonth()-i);
    months.push(d.toISOString().slice(0,7));
  }

  const topEntry = Object.entries(ct).sort((a,b)=>b[1]-a[1])[0];
  const topC = topEntry&&topEntry[1]>0 ? getCat(topEntry[0]) : null;

  const pg = document.getElementById('page-resumen');

      <div class="stat-value" style="font-size:2rem">${'$'+total.toLocaleString('es-MX',{maximumFractionDigits:0})}

      </div>

      </div>

    <div class="grid2" style="margin-bottom:14px">
      <div class="stat-card">
        <div class="stat-label">Total gastado</div>
        <div class="stat-value" style="font-size:1.1rem;color:var(--danger)">${'$'+mTotal.toLocaleString('es-MX',{maximumFractionDigits:0})}</div>

        <div class="stat-label">Mayor categoria</div>
        ${topC
          ? `<div class="stat-value" style="font-size:.95rem">${topC.name}</div>

             <div class="stat-sub">Sin gastos</div>`}

    <div class="sec">Por Categoria — ${rPeriod==='ano'?curYear():mName(rMonth)}</div>
    ${Object.values(ct).some(v=>v>0)?`
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:14px">
      ${CATS.filter(c=>ct[c.id]>0).sort((a,b)=>ct[b.id]-ct[a.id]).map((c,i,arr)=>{
        const pct2=mTotal>0?(ct[c.id]/mTotal*100).toFixed(1):0;

        return `<div style="padding:10px 14px;${i<arr.length-1?'border-bottom:1px solid var(--border)':''}">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:8px;height:8px;border-radius:50%;background:${c.color};flex-shrink:0"></div>

          <div style="background:var(--surface2);border-radius:100px;height:4px;overflow:hidden">
            <div style="height:100%;width:${barW}%;background:${c.color};border-radius:100px"></div>

    </div>
    `:`<div class="empty" style="margin-bottom:14px">Sin gastos en este periodo</div>`}

    <div class="sec">Gastos Mensuales (6 meses)</div>
    <div class="chart-box" style="margin-bottom:20px">
      <canvas id="ch-monthly"></canvas>
    </div>

  // Monthly bar

    type:'bar',
    data:{
      labels:months.map(mName),

// ACTIONS: MOVIMIENTOS
// ═══════════════════════════════════════════════
function doTf(){
  const fId   = document.getElementById('tf-from')?.value;
  const tId   = document.getElementById('tf-to')?.value;
  const amt   = parseFloat(document.getElementById('tf-amt')?.value);
  const date  = document.getElementById('tf-date')?.value||today();
  const note  = document.getElementById('tf-note')?.value;
  if(!fId||!tId||!tId.trim()||!amt||amt<=0) return toast('Completa todos los campos','err');
  if(fId===tId) return toast('Las cuentas deben ser diferentes','err');
  const fa=getAcc(fId), ta=getAcc(tId);
  if(!fa||!ta) return toast('Cuenta no encontrada','err');
  if(fa.currency!==ta.currency) return toast('Deben ser de la misma moneda','err');
  if(fa.balance<amt) return toast('Saldo insuficiente','err');
  fa.balance=+(fa.balance-amt).toFixed(8);
  ta.balance=+(ta.balance+amt).toFixed(8);
  S.transactions.push({id:uid(),type:'transfer',fromAccountId:fId,toAccountId:tId,amount:amt,currency:fa.currency,date,note});
  save(); toast('Transferencia registrada'); renderMover();
}

function doRet(){
  const aId   = document.getElementById('ret-acc')?.value;
  const amt   = parseFloat(document.getElementById('ret-amt')?.value);
  const date  = document.getElementById('ret-date')?.value||today();
  const cat   = document.getElementById('ret-cat')?.value||'otros';
  const note  = document.getElementById('ret-note')?.value;
  if(!aId||!amt||amt<=0) return toast('Completa todos los campos','err');
  const a=getAcc(aId);
  if(!a) return toast('Cuenta no encontrada','err');
  if(a.balance<amt) return toast('Saldo insuficiente','err');
  // Deduct from account
  a.balance=+(a.balance-amt).toFixed(8);
  // Register withdrawal movement
  S.transactions.push({id:uid(),type:'retiro',accountId:aId,amount:amt,currency:a.currency,date,note});
  // Auto-register as expense
  S.transactions.push({id:uid(),type:'expense',accountId:aId,amount:amt,currency:a.currency,cat,date,note:note||'Retiro'});
  save(); toast('Retiro registrado y gasto creado'); renderMover();
}

function doIng(){
  const aId   = document.getElementById('ing-acc')?.value;
  const amt   = parseFloat(document.getElementById('ing-amt')?.value);
  const date  = document.getElementById('ing-date')?.value||today();
  const note  = document.getElementById('ing-note')?.value;
  if(!aId||!amt||amt<=0) return toast('Completa todos los campos','err');
  const a=getAcc(aId);
  if(!a) return toast('Cuenta no encontrada','err');
  a.balance=+(a.balance+amt).toFixed(8);
  S.transactions.push({id:uid(),type:'income',accountId:aId,amount:amt,currency:a.currency,date,note});
  save(); toast('Ingreso registrado'); renderMover();
}

// Delete from Movimientos — reverts account balance
function delMovTx(id){
  const t=S.transactions.find(x=>x.id===id);
  if(!t) return;
  if(t.type==='income'){
    const a=getAcc(t.accountId); if(a) a.balance=+(a.balance-t.amount).toFixed(8);
  } else if(t.type==='transfer'){
    const fa=getAcc(t.fromAccountId), ta=getAcc(t.toAccountId);
    if(fa) fa.balance=+(fa.balance+t.amount).toFixed(8);
    if(ta) ta.balance=+(ta.balance-t.amount).toFixed(8);
  } else if(t.type==='retiro'){
    const a=getAcc(t.accountId); if(a) a.balance=+(a.balance+t.amount).toFixed(8);
    // also remove the paired expense (same date + amount + accountId)
    S.transactions=S.transactions.filter(x=>
      !(x.type==='expense'&&x.accountId===t.accountId&&x.amount===t.amount&&x.date===t.date));
  }
  S.transactions=S.transactions.filter(x=>x.id!==id);
  save(); toast('Movimiento eliminado'); renderMover();
}

// Delete from Gastos — purely removes record, no balance change
function delTx(id){
  S.transactions=S.transactions.filter(x=>x.id!==id);
  save(); toast('Gasto eliminado'); renderGastos();
}

  showModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">Configuracion</div>
    <div style="margin-bottom:16px">
      <div style="font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:10px">Tipos de Cambio a MXN</div>
      <div class="rate-row">
        <span class="rate-row-label">1 USD</span>
        <input class="form-control rate-in" type="number" id="r-usd" value="${S.rates.USD}" step="0.01" min="1">
      </div>
      <div class="rate-row">
        <span class="rate-row-label">1 EUR</span>
        <input class="form-control rate-in" type="number" id="r-eur" value="${S.rates.EUR}" step="0.01" min="1">
      </div>
    </div>
    <div style="margin-bottom:20px">
      <div style="font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:10px">Meta Anual</div>
      <div class="rate-row">
        <span class="rate-row-label">Meta en MXN</span>
        <input class="form-control rate-in" type="number" id="r-goal" value="${S.goal}" step="10000" min="1">
      </div>
    </div>
    <button class="btn btn-primary btn-block" onclick="saveRates()">Guardar</button>
    <div class="divider"></div>
    <button class="btn btn-ghost btn-block" onclick="openEditBalances()">Editar Saldos de Cuentas</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px;color:var(--danger);border-color:rgba(239,68,68,.3)"
      onclick="resetConfirm()">Reiniciar Todos los Datos</button>
  `);
}
function saveRates(){
  const u=parseFloat(document.getElementById('r-usd')?.value);
  const eu=parseFloat(document.getElementById('r-eur')?.value);
  const g=parseFloat(document.getElementById('r-goal')?.value);
  if(u>0) S.rates.USD=u;
  if(eu>0) S.rates.EUR=eu;
  if(g>0) S.goal=g;
  save(); closeModal(); render(page); toast('Configuracion guardada');
}
function openEditBalances(){
  showModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">Editar Saldos</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${S.accounts.map(a=>`
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:8px;height:8px;border-radius:50%;background:${a.color};flex-shrink:0"></div>
          <div style="flex:1">
            <div style="font-size:.82rem;font-weight:600">${a.name}</div>
            <div style="font-size:.68rem;color:var(--muted)">${a.currency}</div>
          </div>
          <input class="form-control" type="number" style="width:140px;text-align:right"
            id="bal-${a.id}" value="${a.balance}" step="0.01">
        </div>`).join('')}
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:18px" onclick="saveBalances()">Guardar Saldos</button>
  `);
}
function saveBalances(){
  S.accounts.forEach(a=>{
    const el=document.getElementById('bal-'+a.id);
    if(el){ const v=parseFloat(el.value); if(!isNaN(v)) a.balance=v; }
  });
  save(); closeModal(); render(page); toast('Saldos actualizados');
}
function resetConfirm(){
  if(confirm('Se eliminaran todos los datos. Esta accion no se puede deshacer.')){
    localStorage.removeItem('fp3'); location.reload();
  }
}

// ═══════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════
function showModal(html){
  const bg=document.getElementById('modal-bg');
  const m=document.getElementById('modal');
  m.innerHTML=html; bg.style.display='block'; m.style.display='block';
}
function closeModal(){
  document.getElementById('modal-bg').style.display='none';
  document.getElementById('modal').style.display='none';
  document.getElementById('modal').innerHTML='';
}

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
let tTimer;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast'+(type==='err'?' err':'')+' show';
  clearTimeout(tTimer);
  tTimer=setTimeout(()=>el.classList.remove('show'),2600);
}

// ═══════════════════════════════════════════════
// SERVICE WORKER
// ═══════════════════════════════════════════════
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ═══════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════
const MOON_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
const SUN_SVG  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;

function initTheme() {
  const saved = localStorage.getItem('fp-theme') ||
    (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  applyTheme(saved);
}

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('fp-theme', t);
  const btn = document.getElementById('theme-btn');
  if (btn) {
    btn.innerHTML = t === 'dark' ? SUN_SVG : MOON_SVG;
    btn.title = t === 'dark' ? 'Modo claro' : 'Modo oscuro';
  }
  const meta = document.getElementById('theme-color-meta');
  if (meta) meta.content = t === 'dark' ? '#0f172a' : '#ffffff';
  // Update Chart.js global defaults for new theme
  if (t === 'light') {
    Chart.defaults.color = '#64748b';
    Chart.defaults.borderColor = '#e2e8f0';
  } else {
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = '#334155';
  }
  // Redraw charts to match new theme
  Object.keys(CH).forEach(k => killChart(k));
  render(page);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
initTheme();
initFromSupabase(); // carga desde Supabase y activa sync en tiempo real
</script>
